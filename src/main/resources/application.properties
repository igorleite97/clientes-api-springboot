# ============================================================
#  Configurações da aplicação — clientesapi
#  Ambiente: desenvolvimento local com H2
# ============================================================

spring.application.name=clientesapi

# ----- Banco de dados H2 -----
# O banco fica em memória; os dados somem ao reiniciar (intencional em dev)
spring.datasource.url=jdbc:h2:mem:clientesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----- JPA / Hibernate -----
# Dialeto removido: no Hibernate 6 (Spring Boot 3.x) é detectado automaticamente.
# Manter explícito gera WARN desnecessário: HHH90000025
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desabilitado para APIs REST — evita manter conexão aberta durante toda a requisição
spring.jpa.open-in-view=false

# ----- Console H2 -----
# Habilitamos o console web mas vamos protegê-lo na SecurityConfig
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Aqui está a proteção: só acesso local — isso já reduz a superfície de ataque
spring.h2.console.settings.web-allow-others=false

# ----- OpenFeign (ViaCEP) -----
spring.cloud.openfeign.client.config.viacep.url=https://viacep.com.br

# ----- Springdoc / Swagger -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Evita que o Swagger exponha o endpoint de /error do Spring
springdoc.show-actuator=false

# ----- Porta da aplicação -----
server.port=8080

# ----- Logging -----
# Suprime o aviso "Cannot determine local hostname" do OpenFeign (não afeta funcionalidade)
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR
